[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gkx-public-data-research"
version = "1.0.0"
description = "Publication companion for a public-data partial replication and extension of GKX"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib==3.10.8",
  "numpy==2.4.3",
  "pandas==3.0.1",
  "pytest==9.0.2",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
